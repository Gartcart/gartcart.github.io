# AI tools were used to write this workflow!
name: Repository Traffic

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Fetch view counts
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/traffic/views?per=day" > /tmp/views.json 2>/tmp/err.txt; then
            echo "::error::Traffic API call failed:"
            cat /tmp/err.txt
            if grep -q "403" /tmp/err.txt; then
              echo "::error::403 Please check token access"
            fi
            exit 1
          fi
          echo "Fetched $(python3 -c 'import json;print(len(json.load(open("/tmp/views.json"))["views"]))') day(s)."

      - name: Merge into traffic/views.csv
        run: python3 .github/scripts/merge_traffic.py /tmp/views.json traffic/views.csv

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/views.csv
          if git diff --cached --quiet -- traffic/views.csv; then
            echo "No new traffic data; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update traffic data"
          git push
